<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>INC Demo</title>

  <!-- Bootstrap 5 -->
  <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
  />

  <style>
      /* ── Layout ─────────────────────────────────────────── */
      html, body {
          height: 100%;
          margin: 0;
          padding: 0;
          background: #0d1117;
          color: #e6edf3;
          font-family: 'Segoe UI', system-ui, sans-serif;
      }

      /* ── Navbar ─────────────────────────────────────────── */
      .site-navbar {
          background: #161b22;
          border-bottom: 1px solid #30363d;
          padding: 0.6rem 1.5rem;
      }

      .site-navbar .brand {
          font-size: 1.2rem;
          font-weight: 700;
          color: #58a6ff;
          text-decoration: none;
          letter-spacing: 0.04em;
      }

      .site-navbar .nav-badge {
          background: #1f6feb;
          color: #fff;
          font-size: 0.7rem;
          padding: 2px 8px;
          border-radius: 20px;
          margin-left: 0.5rem;
          vertical-align: middle;
      }

      /* ── Main wrapper ───────────────────────────────────── */
      .page-wrapper {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          min-height: calc(100vh - 56px); /* subtract navbar height */
          padding: 1.5rem;
          box-sizing: border-box;
      }

      /* ── iframe card ────────────────────────────────────── */
      .iframe-card {
          width: 80vw;
          height: 80vh;
          background: #161b22;
          border: 1px solid #30363d;
          border-radius: 12px;
          overflow: hidden;
          box-shadow: 0 8px 40px rgba(0, 0, 0, 0.55);
          display: flex;
          flex-direction: column;
      }

      /* ── Fake browser chrome ────────────────────────────── */
      .iframe-chrome {
          display: flex;
          align-items: center;
          gap: 0.5rem;
          padding: 0.55rem 1rem;
          background: #21262d;
          border-bottom: 1px solid #30363d;
          flex-shrink: 0;
      }

      .chrome-dot {
          width: 12px;
          height: 12px;
          border-radius: 50%;
      }

      .chrome-dot.red {
          background: #ff5f57;
      }

      .chrome-dot.yellow {
          background: #ffbd2e;
      }

      .chrome-dot.green {
          background: #28c840;
      }

      .chrome-url {
          flex: 1;
          background: #0d1117;
          border: 1px solid #30363d;
          border-radius: 6px;
          padding: 3px 10px;
          font-size: 0.8rem;
          color: #8b949e;
          margin-left: 0.5rem;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
      }

      /* ── The iframe itself ──────────────────────────────── */
      .site-iframe {
          flex: 1;
          width: 100%;
          border: none;
          display: block;
      }

      /* ── Loading overlay ────────────────────────────────── */
      .iframe-overlay {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: #161b22;
          z-index: 10;
          transition: opacity 0.4s ease;
          pointer-events: none;
      }

      .iframe-overlay.hidden {
          opacity: 0;
      }

      .spinner-ring {
          width: 48px;
          height: 48px;
          border: 4px solid #30363d;
          border-top-color: #58a6ff;
          border-radius: 50%;
          animation: spin 0.9s linear infinite;
          margin-bottom: 1rem;
      }

      @keyframes spin {
          to {
              transform: rotate(360deg);
          }
      }

      /* ── Footer note ────────────────────────────────────── */
      .footer-note {
          margin-top: 1rem;
          font-size: 0.78rem;
          color: #6e7681;
      }

      .footer-note a {
          color: #58a6ff;
          text-decoration: none;
      }

      .footer-note a:hover {
          text-decoration: underline;
      }

      /* ── Responsive tweaks ──────────────────────────────── */
      @media (max-width: 768px) {
          .iframe-card {
              width: 95vw;
              height: 75vh;
          }
      }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="site-navbar d-flex align-items-center">
  <a href="#" class="brand">InvestNChill<span class="nav-badge">Demo</span></a>
  <div class="ms-auto d-flex gap-3 align-items-center">
    <a href="https://investnchill.com" target="_blank" rel="noopener noreferrer"
       class="btn btn-sm btn-outline-secondary" style="color:#8b949e; border-color:#30363d;">
      Open full site
    </a>
  </div>
</nav>

<!-- Main content -->
<div class="page-wrapper">

  <div class="iframe-card position-relative">

    <!-- Loading overlay -->
    <div class="iframe-overlay" id="loadingOverlay">
      <div class="spinner-ring"></div>
      <span style="color:#8b949e; font-size:0.85rem;">Loading investnchill.com…</span>
    </div>

    <!-- Browser chrome bar -->
    <div class="iframe-chrome">
      <span class="chrome-dot red"></span>
      <span class="chrome-dot yellow"></span>
      <span class="chrome-dot green"></span>
      <span class="chrome-url">https://investnchill.com</span>
    </div>

    <!-- The embedded site -->
    <iframe
        class="site-iframe"
        id="siteFrame"
        src="http://171.244.139.128:82/stocks/ACB?accessToken=eyJhbGciOiJIUzUxMiJ9.eyJzdWIiOiJhZG1pbkBhZG1pbi5jb20iLCJ1c2VySWQiOjEyOCwicm9sZXMiOlsiUk9MRV9BRE1JTiJdLCJpc1ZpcCI6MCwiZW5hYmxlZCI6dHJ1ZSwiaWF0IjoxNzY2NzU4NzU4fQ.r6D_k1QIMq4oUDFtONVl453bowDywjT652mG4Fx0tUhqQDtk1XYbjJ8H1nxkDGeDyyzIm0jWMhy9TJ4JFTj7tg"
        title="investnchill"
        allowfullscreen
        loading="lazy"
    ></iframe>

  </div>

  <p class="footer-note">
    Previewing <a href="https://investnchill.com" target="_blank" rel="noopener noreferrer">investnchill.com</a>
    &mdash; content is served directly from the source.
  </p>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const frame = document.getElementById('siteFrame');
  const overlay = document.getElementById('loadingOverlay');

  frame.addEventListener('load', () => {
    overlay.classList.add('hidden');
    setTimeout(() => {
      overlay.style.display = 'none';
    }, 450);
  });
</script>

</body>
</html>
